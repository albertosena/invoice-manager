services:
  invoice-web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - invoice-api
    restart: unless-stopped

  invoice-api:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=invoice-db;Port=5432;Database=${POSTGRES_DB:-invoice_manager};Username=${POSTGRES_USER:-invoice};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      Extractor__BaseUrl: http://invoice-extractor:8000
      Jwt__Issuer: ${JWT_ISSUER:-invoice-manager}
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY no arquivo .env}
    volumes:
      - invoice_uploads:/app/uploads
    depends_on:
      - invoice-db
      - invoice-extractor
    restart: unless-stopped

  invoice-extractor:
    build:
      context: ./extractor
    ports:
      - "127.0.0.1:${EXTRACTOR_PORT:-8000}:8000"
    restart: unless-stopped

  invoice-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoice_manager}
      POSTGRES_USER: ${POSTGRES_USER:-invoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - invoice_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  invoice_pgdata:
  invoice_uploads:
